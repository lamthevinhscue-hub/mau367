<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị - Mẫu 367</title>
<style>:root{--red:#a3161a;--red2:#7a0e12;--gold:#d9a441;--bg:#f5f3ee;--card:#fff;--line:#d9d2c3;--ink:#1f2328;--mute:#646a73;--ok:#1a7f4b;--warn:#b45309;--soft:#fbf7ee}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:14px 0;border-bottom:3px solid var(--gold)}
.brand{display:flex;gap:12px;align-items:center}
.brand .star{font-size:30px;color:var(--gold);line-height:1}
.brand b{display:block;font-size:17px;letter-spacing:.3px}
.brand small{display:block;opacity:.9;font-size:13px}
main{padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 6px;font-size:18px;color:var(--red2)}
.card h3{margin:0 0 8px;font-size:16px}
p{margin:0 0 10px}
.mute{color:var(--mute);font-size:13.5px}
.hint{color:var(--mute);font-size:13px;margin:2px 0 8px}
h4.sec{margin:18px 0 6px;padding:6px 10px;background:var(--soft);border-left:4px solid var(--gold);font-size:14.5px;border-radius:0 6px 6px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fld.wide{grid-column:1/-1}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.fld label .req{color:var(--red)}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #bdb6a6;border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
input[type=checkbox]{width:auto;margin-right:6px}
.inline{display:flex;gap:6px}
.inline>*{flex:1;min-width:0}
.inline>.grow2{flex:2}
.err{color:var(--red);font-size:13px;margin-top:3px}
.warnbox{background:#fff7e6;border:1px solid #f0c36d;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.okbox{background:#ecf8f1;border:1px solid #9bd3b4;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.warnbox ul,.okbox ul{margin:6px 0 0;padding-left:20px}
.warnbox li{margin:3px 0}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid #bdb6a6;background:#fff;padding:8px 14px;color:var(--ink)}
button:hover{background:#f3efe6}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.pri:hover{background:var(--red2)}
button.sm{padding:4px 9px;font-size:13px}
button.danger{color:var(--red);border-color:#e3b3b3}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar .sp{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px;border-bottom:2px solid var(--line)}
.tabs button{border:0;border-radius:6px 6px 0 0;background:transparent;padding:9px 14px;font-weight:600;color:var(--mute);margin-bottom:-2px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--red2);border-bottom-color:var(--red);background:#fff}
.who{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px}
details.person{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
details.person>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style-position:inside}
details.person[open]>summary{border-bottom:1px solid var(--line);background:var(--soft);border-radius:10px 10px 0 0}
details.person .body{padding:6px 14px 14px}
.badge{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.badge.w{background:#fde8c8;color:var(--warn)}
.badge.ok{background:#d9f2e3;color:var(--ok)}
.badge.i{background:#e6ebf3;color:#34507a}
.trow{display:flex;gap:6px;align-items:flex-end;margin-bottom:6px}
.trow>div{flex:1;min-width:0}
.trow>div.wide{flex:3}
.trow small{display:block;font-size:11.5px;color:var(--mute)}
.trow>button{flex:0 0 auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th,table.list td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.list th{background:var(--soft)}
.scroll{overflow-x:auto}
.doc{background:#fff;border:1px solid var(--line);padding:28px 34px;border-radius:6px;overflow-x:auto}
@media (max-width:640px){.grid{grid-template-columns:1fr}.trow{flex-wrap:wrap}.trow>div{flex:1 1 45%}.trow>div.wide{flex:1 1 100%}.doc{padding:14px}.brand b{font-size:15px}}
@media print{.noprint,header.top{display:none!important}body{background:#fff}main{padding:0}.wrap{max-width:none;padding:0}.doc{border:0;padding:0;overflow:visible}}
</style>
</head>

  }

  /* ---------- Tab 3: quản trị viên ---------- */
  function drawAdmins(pane) {
    var me = A.me, card = h('div', { class: 'card' }), er = h('div', { class: 'err' });
    card.appendChild(h('h2', null, 'Quản trị viên'));
    if (me.must) card.appendChild(h('div', { class: 'warnbox' }, 'Anh/chị đang dùng mật khẩu tạm. Vui lòng đổi mật khẩu trước khi sử dụng các chức năng khác.'));
    var o = pwInput(), n1 = pwInput('Tối thiểu 8 ký tự, gồm chữ và số'), n2 = pwInput();
    card.appendChild(h('h4', { class: 'sec' }, 'Đổi mật khẩu của tôi (' + me.u + ')'));
    card.appendChild(h('div', { class: 'grid' }, [fld('Mật khẩu hiện tại', o), h('div'), fld('Mật khẩu mới', n1), fld('Nhập lại mật khẩu mới', n2)]));
    card.appendChild(h('div', { class: 'bar' }, [h('button', { type: 'button', class: 'pri', onclick: function () {
      if (n1.value !== n2.value) { er.textContent = 'Hai lần nhập mật khẩu mới chưa giống nhau.'; return; }
      srv('apiAdminChangePw', o.value, n1.value).then(function (r) { if (r) { draw(); say('Đã đổi mật khẩu.'); } });
    } }, 'Đổi mật khẩu')]));
    card.appendChild(er);
    if (!me.must) {
      card.appendChild(h('h4', { class: 'sec' }, 'Danh sách quản trị viên'));
      var rows = A.admins.map(function (a, i) {
        var mine = a.u.toLowerCase() === me.u.toLowerCase();
        return h('tr', null, [h('td', null, String(i + 1)), h('td', null, a.u + (mine ? ' (tôi)' : '')), h('td', null, a.name || ''), h('td', null, a.created || ''), h('td', null, h('span', { class: 'badge ' + (a.must ? 'w' : 'ok') }, a.must ? 'Đang dùng mật khẩu tạm' : 'Đã đặt mật khẩu riêng')),
          h('td', null, mine ? '' : h('button', { type: 'button', class: 'sm danger', onclick: function (e) { var b = e.target; if (b.dataset.sure) srv('apiAdminDelAdmin', a.u).then(function (r) { if (r) { draw(); say('Đã xóa quản trị viên.'); } }); else { b.dataset.sure = 1; b.textContent = 'Bấm lần nữa để xóa'; } } }, 'Xóa'))]);
      });
      card.appendChild(h('div', { class: 'scroll' }, h('table', { class: 'list' }, [h('tr', null, ['STT', 'Tên đăng nhập', 'Họ và tên', 'Ngày tạo', 'Mật khẩu', 'Thao tác'].map(function (x) { return h('th', null, x); }))].concat(rows))));
      var nm = h('input', { type: 'text' }), us = h('input', { type: 'text', autocomplete: 'off' }), tp = h('input', { type: 'text', autocomplete: 'off', placeholder: 'Tối thiểu 8 ký tự, gồm chữ và số' });
      card.appendChild(h('h4', { class: 'sec' }, 'Bổ sung quản trị viên'));
      card.appendChild(h('p', { class: 'hint' }, 'Người được bổ sung đăng nhập bằng mật khẩu tạm và phải đổi mật khẩu ngay lần đăng nhập đầu tiên.'));
      card.appendChild(h('div', { class: 'grid' }, [fld('Họ và tên', nm), fld('Tên đăng nhập', us), fld('Mật khẩu tạm', tp)]));
      card.appendChild(h('div', { class: 'bar' }, [h('button', { type: 'button', class: 'pri', onclick: function () {
        srv('apiAdminAddAdmin', us.value.trim(), nm.value.trim(), tp.value).then(function (r) { if (r) { draw(); say('Đã bổ sung quản trị viên. Gửi đường link trang quản trị, tên đăng nhập và mật khẩu tạm cho người được bổ sung.'); } });
      } }, 'Bổ sung quản trị viên')]));
    }
    pane.appendChild(card);
  }

  /* ---------- Tab 4: hướng dẫn ---------- */
  function drawHelp(pane) {
    pane.appendChild(h('div', { class: 'card', html:
      '<h2>Hướng dẫn sử dụng</h2>' +
      '<h4 class="sec">Quy trình</h4><ol>' +
      '<li>Tab "Danh sách kiểm duyệt": thêm hoặc sửa nhân vật trung tâm. Thay đổi có hiệu lực ngay.</li>' +
      '<li>Sao chép đường link form và gửi cho thân nhân qua Zalo hoặc email.</li>' +
      '<li>Thân nhân mở đường link, nhập số CCCD/CMND/hộ chiếu của nhân vật trung tâm và chọn mối quan hệ để xác thực, kê khai rồi bấm "Gửi phiếu".</li>' +
      '<li>Dữ liệu tự đổ về Google Sheets: trang tính "Phieu" (mỗi phiếu một dòng) và "ThanNhan" (mỗi thân nhân một dòng). Có thể tải về Excel từ menu Tệp của Google Sheets.</li>' +
      '<li>Tab "Phiếu đã nhận": bấm "Tải phiếu từ hệ thống", kiểm tra hồ sơ trùng, tải file Word báo cáo 367 hoàn chỉnh.</li></ol>' +
      '<h4 class="sec">Quản trị viên</h4><ul>' +
      '<li>Bổ sung quản trị viên tại tab "Quản trị viên" hoặc tại menu "Mẫu 367" trong Google Sheets.</li>' +
      '<li>Quên mật khẩu: chủ sở hữu bảng tính đặt lại tại menu "Mẫu 367" &gt; "Đặt lại mật khẩu quản trị viên".</li></ul>' +
      '<h4 class="sec">Lưu ý về bảo mật</h4><ul>' +
      '<li>Việc xác thực được thực hiện ở máy chủ; số giấy tờ của nhân vật trung tâm không nằm trong trang web gửi cho thân nhân.</li>' +
      '<li>Toàn bộ dữ liệu nằm trong bảng tính Google Sheets. Chỉ chia sẻ bảng tính cho đúng người có trách nhiệm; người được chia sẻ bảng tính xem được toàn bộ dữ liệu kê khai.</li>' +
      '<li>Thân nhân gửi lại phiếu (cùng một lần kê khai) sẽ thay thế phiếu cũ, không tạo dòng trùng.</li></ul>' }));
  }

  function draw() {
    var tb = $('tabs'), pane = $('pane'); tb.innerHTML = ''; pane.innerHTML = '';
    if (!A.me) { drawLogin(pane); return; }
    if (A.me.must) A.tab = 2;
    ['Danh sách kiểm duyệt', 'Phiếu đã nhận và lập báo cáo 367', 'Quản trị viên', 'Hướng dẫn'].forEach(function (t, i) {
      tb.appendChild(h('button', { type: 'button', class: i === A.tab ? 'on' : null, disabled: A.me.must && i !== 2, onclick: function () { A.tab = i; A.edit = null; say(''); draw(); } }, t));
    });
    tb.appendChild(h('span', { style: 'flex:1' }));
    tb.appendChild(h('span', { class: 'mute', style: 'align-self:center;margin-right:8px' }, 'Đang đăng nhập: ' + (A.me.name || A.me.u)));
    tb.appendChild(h('button', { type: 'button', onclick: function () { logout(); } }, 'Đăng xuất'));
    [drawList, drawMerge, drawAdmins, drawHelp][A.tab](pane);
  }
  document.head.appendChild(h('style', null, DOC_CSS));
  draw();
})();
</script>
</body>
</html>
